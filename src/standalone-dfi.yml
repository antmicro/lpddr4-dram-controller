{
    # General ------------------------------------------------------------------
    "speedgrade": -1,          # FPGA speedgrade

    # SDRAM --------------------------------------------------------------------
    # Changing the memtype doesn't seem to do much unfortunately
    "memtype":          "LPDDR4",        # DRAM type
    "sdram_module":     "MT53E256M16D1",  # SDRAM modules of the board or SO-DIMM
    # "memtype":          "DDR3",        # DRAM type
    # "sdram_module":     "DDR3Module",  # SDRAM modules of the board or SO-DIMM
    "sdram_data_nb":    8,            # Number of data bits
    "sdram_module_nb":  2,             # Number of byte groups
    "sdram_rank_nb":    1,             # Number of ranks
    "sdram_ratio":      2,
    "sdram_rows":       8192,
    "sdram_cols":       1024,

    "refresh_zqcs_freq":    10.0,      # ZQCS command frequency [Hz]

    # DFI ----------------------------------------------------------------------
    # Override DFI address and bank widths
    "dfi_nphases":      1,
    "dfi_addressbits":  17,
    "dfi_bankbits":     6,

    # Frequency ----------------------------------------------------------------
    "sys_clk_freq":     75e6,  # System clock frequency

    # Core ---------------------------------------------------------------------
    "csr_base":         0x83000000, # CSR bank base address
    "cmd_buffer_depth": 16,    # Depth of the command buffer

    # User Ports ---------------------------------------------------------------
    "user_ports": {
        "wishbone_0" : {
            "type":                 "wishbone",
            "data_width":           32,
            "block_until_ready":    True,
        },
    },
}
